<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        }

        .og-card {
            width: 1200px;
            height: 630px;
            background: #111827;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .og-card::before {
            content: '';
            position: absolute;
            top: -150px;
            left: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(124, 58, 237, .2), transparent 70%);
            border-radius: 50%;
        }

        .og-card::after {
            content: '';
            position: absolute;
            bottom: -100px;
            right: 100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(167, 139, 250, .12), transparent 70%);
            border-radius: 50%;
        }

        .content {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 0 80px;
        }

        h1 {
            font-size: 52px;
            font-weight: 900;
            color: #fff;
            line-height: 1.4;
            margin-bottom: 28px;
            letter-spacing: -1px;
        }

        h1 .highlight {
            color: #A78BFA;
        }

        .desc {
            font-size: 20px;
            color: rgba(255, 255, 255, 0.55);
            line-height: 1.7;
            margin-bottom: 40px;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: #7C3AED;
            color: #fff;
            font-weight: 700;
            font-size: 16px;
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(124, 58, 237, .35);
        }
    </style>
</head>

<body>
    <div class="og-card">
        <div class="content">
            <h1>AI 시대, 업무를 효율화하고<br>조직의 <span class="highlight">생산성</span>을 설계합니다.</h1>
            <div class="desc">
                공공기관, 학교, 기업까지 — 생성형AI 업무 혁신 교육 300회 이상 진행.<br>
                실무 중심의 체계적인 AI 교육으로 조직의 디지털 전환을 이끕니다.
            </div>
            <div class="btn">강의 문의하기</div>
        </div>
    </div>
</body>

</html>
